<div class="location-picker">
  <div class="location-header">
    <h3>Farm Location</h3>
    <p>Select your farm location on the map</p>
  </div>

  <div class="map-controls">
    <button
      type="button"
      mat-stroked-button
      class="location-btn"
      (click)="useCurrentLocation()"
      [disabled]="isLoadingLocation">
      <mat-spinner *ngIf="isLoadingLocation" diameter="18"></mat-spinner>
      <mat-icon *ngIf="!isLoadingLocation">my_location</mat-icon>
      <span>{{ isLoadingLocation ? 'Getting Location...' : 'Use My Current Location' }}</span>
    </button>

    <button
      type="button"
      mat-stroked-button
      class="reset-btn"
      (click)="resetLocation()"
      *ngIf="hasLocation">
      <mat-icon>refresh</mat-icon>
      <span>Reset</span>
    </button>
  </div>

  <div class="search-section">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search Location</mat-label>
      <input
        matInput
        [formControl]="searchQuery"
        (keyup.enter)="searchLocation()"
        placeholder="e.g., Cairo, Fayoum">
      <button
        type="button"
        mat-icon-button
        matSuffix
        (click)="searchLocation()"
        [disabled]="isSearching || !searchQuery.value">
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>

    <div *ngIf="searchResults.length > 0" class="search-results">
      <div
        *ngFor="let result of searchResults"
        class="search-result-item"
        (click)="selectSearchResult(result)">
        <mat-icon>location_on</mat-icon>
        <span>{{ result.display_name }}</span>
      </div>
      <button
        type="button"
        mat-button
        class="clear-search-btn"
        (click)="clearSearchResults()">
        Clear
      </button>
    </div>
  </div>

  <div *ngIf="locationError" class="error-message">
    <mat-icon>error_outline</mat-icon>
    <span>{{ locationError }}</span>
  </div>

  <div
    #mapContainer
    class="map-container"
    [style.height]="height">
  </div>

  <div *ngIf="hasLocation" class="coordinates-display">
    <div class="coordinate-item">
      <mat-icon>place</mat-icon>
      <span>Latitude: <strong>{{ currentLat?.toFixed(6) }}</strong></span>
    </div>
    <div class="coordinate-item">
      <mat-icon>place</mat-icon>
      <span>Longitude: <strong>{{ currentLng?.toFixed(6) }}</strong></span>
    </div>
  </div>
</div>
