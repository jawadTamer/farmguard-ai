<div class="auth-page">

  <div class="auth-card">

    <h1>Forgot Password?</h1>

    <p>
      Enter your email and we'll send you a password reset link.
    </p>

    <form (ngSubmit)="resetPassword()">

      <div class="form-group">

        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />

      </div>

      @if (errorMessage()) {
        <div class="error-message">
          {{ errorMessage() }}
        </div>
      }

      @if (successMessage()) {
        <div class="success-message">
          {{ successMessage() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading()"
      >
        @if (loading()) {
          Sending...
        } @else {
          Send Reset Link
        }
      </button>

    </form>

    <p>
      <a routerLink="/login">
        Back to Login
      </a>
    </p>

  </div>

</div>
